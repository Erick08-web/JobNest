services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD in .env.production}
    expose:
      - "1433"
    volumes:
      - sqlserver_data_prod:/var/opt/mssql
    networks:
      - jobnest_private
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${JOBNEST_ENV_FILE:-.env.production}
    environment:
      DB_SERVER: sqlserver,1433
      DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "no"
      TRUST_PROXY_HEADERS: "true"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: Lax
      INSTANCE_ID: api1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "5000"
    volumes:
      - jobnest_uploads_prod:/app/static/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - jobnest_public
      - jobnest_private
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${JOBNEST_ENV_FILE:-.env.production}
    environment:
      DB_SERVER: sqlserver,1433
      DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "no"
      TRUST_PROXY_HEADERS: "true"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: Lax
      INSTANCE_ID: api2
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "5000"
    volumes:
      - jobnest_uploads_prod:/app/static/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - jobnest_public
      - jobnest_private
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?define PUBLIC_DOMAIN in .env.production}
    environment:
      NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?define PUBLIC_DOMAIN in .env.production}
    expose:
      - "3000"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - jobnest_public
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - jobnest_public
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data_prod:/prometheus
    expose:
      - "9090"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - jobnest_public
      - monitoring_net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - monitoring_net
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  jobnest_public:
  jobnest_private:
    internal: true
  monitoring_net:
    internal: true

volumes:
  sqlserver_data_prod:
  jobnest_uploads_prod:
  prometheus_data_prod:
  grafana_data_prod:
