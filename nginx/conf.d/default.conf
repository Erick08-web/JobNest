upstream jobnest_frontend {
    server frontend:3000;
}

upstream jobnest_api {
    least_conn;
    server api1:5000 max_fails=3 fail_timeout=30s;
    server api2:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /health {
        proxy_pass http://jobnest_api/health;
    }

    location = /health/ready {
        proxy_pass http://jobnest_api/health/ready;
    }

    location /api/backend/ {
        proxy_pass http://jobnest_api/;
    }

    location /api/ {
        proxy_pass http://jobnest_api;
    }

    location /static/ {
        proxy_pass http://jobnest_api;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://jobnest_frontend;
    }
}
