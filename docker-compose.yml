services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobnest-sqlserver-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data_dev:/var/opt/mssql
    networks:
      - jobnest_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobnest-api-dev
    env_file:
      - ${JOBNEST_ENV_FILE:-.env}
    environment:
      DB_SERVER: sqlserver,1433
      DB_DRIVER: "{ODBC Driver 18 for SQL Server}"
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "yes"
      TRUST_PROXY_HEADERS: "false"
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "5001:5000"
    volumes:
      - jobnest_uploads_dev:/app/static/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - jobnest_public
      - jobnest_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:5000
    container_name: jobnest-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jobnest_public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  jobnest_public:
  jobnest_private:
    internal: true

volumes:
  sqlserver_data_dev:
  jobnest_uploads_dev:
