global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: jobnest-api
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets:
          - api1:5000
          - api2:5000
        labels:
          environment: production
